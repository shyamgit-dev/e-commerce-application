<!DOCTYPE html>
<html>
<head>
    <title>Razorpay Test Checkout</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body{
            font-family: Arial;
            margin:40px;
        }

        input{
            width:300px;
            padding:10px;
            margin:10px;
        }

        button{
            padding:12px 20px;
            cursor:pointer;
        }

        pre{
            background:#f4f4f4;
            padding:20px;
        }

    </style>

</head>

<body>

<h2>Razorpay Test Checkout</h2>

<input
        id="orderId"
        placeholder="Enter your Application Order Id"
/>

<br>

<button onclick="payNow()">
    Pay
</button>

<h3>Response</h3>

<pre id="result"></pre>

<script>

    async function payNow() {

        let applicationOrderId =
            document.getElementById("orderId").value;

        const jwt =
            prompt("Paste your JWT Access Token");

        try {

            let response =
                await fetch("http://localhost:8080/api/payments/create-order", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + jwt
                    },

                    body: JSON.stringify({
                        orderId: Number(applicationOrderId)
                    })

                });

            // Backend returned an error
            if (!response.ok) {

                let error;

                try {
                    error = await response.json();
                } catch {
                    error = { message: "Something went wrong" };
                }

                alert(error.message || "Unable to create payment order.");

                console.error(error);

                return;   // VERY IMPORTANT
            }

            let order = await response.json();

            console.log(order);

            let options = {

                key: "rzp_test_TC9bGh8pw7xC0e",

                amount: order.amount * 100,

                currency: order.currency,

                order_id: order.id,

                name: "My Ecommerce Application",

                description: "Test Payment",

                handler: function (response) {

                    document.getElementById("result").innerHTML =
                        JSON.stringify(response, null, 4);

                    verifyPayment(jwt, response);

                }

            };

            let rzp = new Razorpay(options);

            rzp.open();

        } catch (err) {

            console.error(err);

            alert("Unable to connect to server.");

        }

    }


        async function verifyPayment(jwt, response) {

    try {

        let verifyResponse =
            await fetch("http://localhost:8080/api/payments/verify", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json",

                    "Authorization": "Bearer " + jwt

                },

                body: JSON.stringify({

                    razorpayOrderId: response.razorpay_order_id,

                    razorpayPaymentId: response.razorpay_payment_id,

                    razorpaySignature: response.razorpay_signature

                })

            });

        if (!verifyResponse.ok) {

            let error = await verifyResponse.json();

            alert(error.message);

            return;

        }

        let result = await verifyResponse.text();

        alert(result);

    } catch (err) {

        console.error(err);

        alert("Payment verification failed.");

    }

}
</script>

</body>

</html>
